name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold if missing
        run: flutter create . --platforms android --org uy.faltauno --project-name falta_uno_uy

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
         SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
         
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$CLAVE_PUBLICABLE_DE_SUPABASE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: falta-uno-uy-v5-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
